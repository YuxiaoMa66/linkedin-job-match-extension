<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1600, initial-scale=1" />
    <title>LinkedIn Job Match README banner</title>
    <link rel="icon" href="../assets/icons/icon128.png" type="image/png" />
    <style>
      :root {
        color-scheme: light;
        --paper: #f4efe5;
        --ink: #251b12;
        --muted: #6f5b49;
        --accent: #9a4a30;
        --line: rgba(93, 63, 34, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1600px;
        height: 520px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }

      body {
        font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .canvas {
        position: relative;
        width: 1560px;
        height: 480px;
        margin: 20px;
        overflow: hidden;
        border: 2px solid var(--line);
        border-radius: 36px;
        background: var(--paper);
      }

      .art {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 50%;
      }

      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          rgba(244, 239, 229, 1) 0%,
          rgba(244, 239, 229, 0.99) 38%,
          rgba(244, 239, 229, 0.84) 49%,
          rgba(244, 239, 229, 0.12) 72%,
          rgba(244, 239, 229, 0) 100%
        );
      }

      .content {
        position: absolute;
        top: 66px;
        left: 82px;
        width: 730px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 34px;
        color: var(--ink);
        font-size: 24px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .brand img {
        width: 54px;
        height: 54px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: #fffaf2;
      }

      h1 {
        max-width: 700px;
        margin: 0;
        color: var(--ink);
        font-size: 72px;
        font-weight: 800;
        letter-spacing: -0.055em;
        line-height: 0.98;
      }

      h1 span {
        color: var(--accent);
      }

      p {
        max-width: 650px;
        margin: 26px 0 0;
        color: var(--muted);
        font-size: 26px;
        font-weight: 520;
        letter-spacing: -0.015em;
        line-height: 1.32;
      }
    </style>
  </head>
  <body>
    <main class="canvas">
      <img
        class="art"
        src="assets/match-hero.png"
        alt=""
        width="1586"
        height="992"
      />
      <div class="scrim" aria-hidden="true"></div>
      <section class="content" aria-label="LinkedIn Job Match introduction">
        <div class="brand">
          <img src="../assets/icons/icon128.png" alt="" width="128" height="128" />
          <span>LinkedIn Job Match</span>
        </div>
        <h1>Know the <span>fit</span> before you apply.</h1>
        <p>Resume matching, reusable analysis, and Netherlands sponsorship signals inside LinkedIn.</p>
      </section>
    </main>
  </body>
</html>
